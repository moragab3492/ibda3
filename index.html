<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة إبداع التعليمية</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, setDoc, getDoc, updateDoc, deleteDoc, limit } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDwSZe5sUglFRmXKbGLqtS6_5qO1r5wf9o",
            authDomain: "ibda3-91fde.firebaseapp.com",
            projectId: "ibda3-91fde",
            storageBucket: "ibda3-91fde.firebasestorage.app",
            messagingSenderId: "203097189746",
            appId: "1:203097189746:web:af3a59c8eee851663881eb"
        };

        const app = initializeApp(firebaseConfig);
        window.auth = getAuth(app);
        window.db = getFirestore(app);
        window.firebaseAPI = {
            onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut,
            collection, addDoc, doc, setDoc, getDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy, limit
        };
    </script>
</head>
<body class="bg-slate-50 font-sans text-gray-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { 
            onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut,
            doc, setDoc, getDoc, updateDoc, collection, addDoc, deleteDoc, onSnapshot, query, orderBy, limit 
        } = window.firebaseAPI;

        const getEmbedUrl = (url) => {
            if (!url) return "";
            try {
                if (url.includes("youtube.com/watch")) {
                    const urlParams = new URL(url).searchParams;
                    const v = urlParams.get("v");
                    return v ? `https://www.youtube.com/embed/${v}` : url;
                }
                if (url.includes("youtu.be/")) {
                    const v = url.split("youtu.be/")[1]?.split("?")[0];
                    return v ? `https://www.youtube.com/embed/${v}` : url;
                }
            } catch (e) {
                return url; 
            }
            return url; 
        };

        const handleImageUpload = (e, callback) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onloadend = () => {
                    callback(reader.result);
                };
                reader.readAsDataURL(file);
            }
        };

        function App() {
            const [user, setUser] = useState(null);
            const [role, setRole] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const unsubscribe = onAuthStateChanged(window.auth, async (currentUser) => {
                    setUser(currentUser);
                    if (currentUser) {
                        try {
                            const userDoc = await getDoc(doc(window.db, "users", currentUser.uid));
                            if (userDoc.exists()) {
                                setRole(userDoc.data().role);
                            } else {
                                setRole("student");
                            }
                        } catch (error) {
                            setRole("student");
                        }
                    } else {
                        setRole(null);
                    }
                    setLoading(false);
                });
                return () => unsubscribe();
            }, []);

            if (loading) return <div className="flex items-center justify-center min-h-screen text-blue-600 font-bold text-xl">جاري تحميل منصة إبداع...</div>;

            if (!user) return <Login />;
            if (role === "super_admin" || role === "admin") return <AdminDashboard user={user} role={role} />;
            return <StudentDashboard user={user} />;
        }

        function Login() {
            const [username, setUsername] = useState("");
            const [password, setPassword] = useState("");
            const [isRegister, setIsRegister] = useState(false);
            const [error, setError] = useState("");
            const [loading, setLoading] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError(""); setLoading(true);
                const email = username.trim().toLowerCase() + "@ebdaa.com";

                try {
                    if (isRegister) {
                        if (password.length < 6) {
                            setError("كلمة المرور يجب ألا تقل عن 6 أحرف");
                            setLoading(false);
                            return;
                        }
                        const userCredential = await createUserWithEmailAndPassword(window.auth, email, password);
                        await setDoc(doc(window.db, "users", userCredential.user.uid), {
                            username: username.trim(),
                            role: "student",
                            profileComplete: false,
                            createdAt: new Date().toISOString()
                        });
                    } else {
                        await signInWithEmailAndPassword(window.auth, email, password);
                    }
                } catch (err) {
                    setError("بيانات الدخول غير صحيحة أو الحساب مسجل مسبقاً.");
                }
                setLoading(false);
            };

            return (
                <div className="flex items-center justify-center min-h-screen p-4 bg-slate-100">
                    <div className="bg-white p-8 rounded-xl shadow-lg w-full max-w-sm border-t-4 border-blue-600 relative">
                        <div className="flex items-center gap-3 mb-6 border-b pb-4">
                            <img src="https://i.ibb.co/3m1R0Vb/image.png" alt="شعار إبداع" className="w-12 h-12 object-cover rounded-full border border-teal-500" onError={(e)=>{e.target.style.display='none'}} />
                            <div>
                                <h2 className="text-xl font-bold text-blue-800">منصة إبداع 💡</h2>
                                <h3 className="text-gray-500 text-xs">{isRegister ? "إنشاء حساب طالب جديد" : "تسجيل الدخول"}</h3>
                            </div>
                        </div>

                        {error && <p className="text-red-500 text-sm mb-4 text-center font-bold bg-red-50 p-2 rounded">{error}</p>}
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-gray-700 text-sm font-bold mb-1">اسم المستخدم</label>
                                <input type="text" required value={username} onChange={(e) => setUsername(e.target.value)} className="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" />
                            </div>
                            <div>
                                <label className="block text-gray-700 text-sm font-bold mb-1">كلمة المرور</label>
                                <input type="password" required value={password} onChange={(e) => setPassword(e.target.value)} className="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" />
                            </div>
                            <button type="submit" disabled={loading} className="w-full bg-blue-600 text-white py-2 rounded-lg font-bold hover:bg-blue-700 transition">
                                {loading ? "جاري المعالجة..." : (isRegister ? "إنشاء الحساب" : "تسجيل الدخول")}
                            </button>
                        </form>
                        <button onClick={() => { setIsRegister(!isRegister); setError(""); }} className="w-full text-sm text-blue-600 mt-4 font-medium hover:underline text-center">
                            {isRegister ? "لديك حساب بالفعل؟ سجل دخولك" : "ليس لديك حساب؟ أنشئ حساباً جديداً"}
                        </button>
                    </div>
                </div>
            );
        }

        function AdminDashboard({ user, role }) {
            const [activeSubTab, setActiveSubTab] = useState("courses");
            const [courses, setCourses] = useState([]);
            const [requests, setRequests] = useState([]);
            const [students, setStudents] = useState([]);
            const [promos, setPromos] = useState([]);
            const [socialLinks, setSocialLinks] = useState([]);
            const [selectedCourseForLectures, setSelectedCourseForLectures] = useState(null);
            const [viewingStudentModal, setViewingStudentModal] = useState(null);

            const [editingCourse, setEditingCourse] = useState(null);
            const [editingPromo, setEditingPromo] = useState(null);
            
            const [title, setTitle] = useState("");
            const [duration, setDuration] = useState("");
            const [price, setPrice] = useState("");
            const [targetAudience, setTargetAudience] = useState("");
            const [instructor, setInstructor] = useState("");
            const [desc, setDesc] = useState("");
            const [previewVideoUrl, setPreviewVideoUrl] = useState("");
            const [imageUrl, setImageUrl] = useState("");

            const [promoTitle, setPromoTitle] = useState("");
            const [promoType, setPromoType] = useState("image");
            const [promoUrl, setPromoUrl] = useState("");
            const [promoText, setPromoText] = useState("");

            const [socialTitle, setSocialTitle] = useState("");
            const [socialUrl, setSocialUrl] = useState("");
            const [socialIconUrl, setSocialIconUrl] = useState("");

            useEffect(() => {
                const unsubCourses = onSnapshot(query(collection(window.db, "courses"), orderBy("createdAt", "desc")), (snap) => setCourses(snap.docs.map(doc => ({ id: doc.id, ...doc.data() }))));
                const unsubReq = onSnapshot(query(collection(window.db, "enrollmentRequests"), orderBy("createdAt", "desc")), (snap) => setRequests(snap.docs.map(doc => ({ id: doc.id, ...doc.data() }))));
                const unsubStudents = onSnapshot(collection(window.db, "users"), (snap) => setStudents(snap.docs.map(doc => ({ id: doc.id, ...doc.data() }))));
                const unsubPromos = onSnapshot(query(collection(window.db, "promos"), orderBy("createdAt", "desc")), (snap) => setPromos(snap.docs.map(doc => ({ id: doc.id, ...doc.data() }))));
                const unsubSocial = onSnapshot(query(collection(window.db, "socialLinks"), orderBy("createdAt", "asc")), (snap) => setSocialLinks(snap.docs.map(doc => ({ id: doc.id, ...doc.data() }))));

                return () => { unsubCourses(); unsubReq(); unsubStudents(); unsubPromos(); unsubSocial(); };
            }, []);

            const handleAddCourse = async (e) => {
                e.preventDefault();
                await addDoc(collection(window.db, "courses"), { title, duration, price, targetAudience, instructor, desc, previewVideoUrl, imageUrl, createdAt: new Date().toISOString() });
                setTitle(""); setDuration(""); setPrice(""); setTargetAudience(""); setInstructor(""); setDesc(""); setPreviewVideoUrl(""); setImageUrl("");
            };

            const handleUpdateCourse = async (e) => {
                e.preventDefault();
                await updateDoc(doc(window.db, "courses", editingCourse.id), { ...editingCourse });
                setEditingCourse(null);
            };

            const handleDeleteCourse = async (id) => { if (confirm("هل أنت متأكد من حذف هذه الدورة؟")) await deleteDoc(doc(window.db, "courses", id)); };

            const handleAddPromo = async (e) => {
                e.preventDefault();
                await addDoc(collection(window.db, "promos"), { title: promoTitle, type: promoType, url: promoType !== 'text' ? promoUrl : '', text: promoType === 'text' ? promoText : '', createdAt: new Date().toISOString() });
                setPromoTitle(""); setPromoUrl(""); setPromoText("");
            };

            const handleUpdatePromo = async (e) => {
                e.preventDefault();
                await updateDoc(doc(window.db, "promos", editingPromo.id), { ...editingPromo });
                setEditingPromo(null);
            };

            const handleDeletePromo = async (id) => await deleteDoc(doc(window.db, "promos", id));

            const handleAddSocialLink = async (e) => {
                e.preventDefault();
                if(!socialIconUrl) { alert("يرجى اختيار صورة الأيقونة"); return; }
                await addDoc(collection(window.db, "socialLinks"), { title: socialTitle, url: socialUrl, iconUrl: socialIconUrl, createdAt: new Date().toISOString() });
                setSocialTitle(""); setSocialUrl(""); setSocialIconUrl("");
            };

            const handleDeleteSocialLink = async (id) => await deleteDoc(doc(window.db, "socialLinks", id));

            const handleApproveRequest = async (reqId, studentId, courseId) => {
                await setDoc(doc(window.db, "users", studentId, "enrolledCourses", courseId), { enrolledAt: new Date().toISOString() });
                await updateDoc(doc(window.db, "enrollmentRequests", reqId), { status: "approved" });
            };

            const handleOpenStudentProfile = async (studentId) => {
                const docSnap = await getDoc(doc(window.db, "users", studentId));
                if (docSnap.exists()) setViewingStudentModal(docSnap.data());
                else alert("لم يتم العثور على ملف الطالب.");
            };

            return (
                <div className="p-4 md:p-8 max-w-7xl mx-auto">
                    <div className="flex flex-col sm:flex-row justify-between items-center border-b pb-4 mb-6 gap-4">
                        <div className="flex items-center gap-3">
                            <img src="https://i.ibb.co/3m1R0Vb/image.png" alt="شعار إبداع" className="w-12 h-12 object-cover rounded-full border-2 border-teal-600 shadow" />
                            <div>
                                <h1 className="text-2xl font-bold text-blue-800">لوحة الإدارة ⚙️</h1>
                                <p className="text-sm text-gray-500">منصّة إبداع التعليمية</p>
                            </div>
                        </div>
                        <div className="flex flex-wrap gap-2">
                            <button onClick={() => { setActiveSubTab("courses"); setSelectedCourseForLectures(null); }} className={`px-4 py-2 rounded font-bold text-sm ${activeSubTab === 'courses' ? 'bg-blue-600 text-white' : 'bg-gray-200'}`}>الدورات</button>
                            <button onClick={() => setActiveSubTab("promos")} className={`px-4 py-2 rounded font-bold text-sm ${activeSubTab === 'promos' ? 'bg-blue-600 text-white' : 'bg-gray-200'}`}>الإعلانات 📢</button>
                            <button onClick={() => setActiveSubTab("social")} className={`px-4 py-2 rounded font-bold text-sm ${activeSubTab === 'social' ? 'bg-blue-600 text-white' : 'bg-gray-200'}`}>مواقع التواصل 🌐</button>
                            <button onClick={() => setActiveSubTab("requests")} className={`px-4 py-2 rounded font-bold text-sm ${activeSubTab === 'requests' ? 'bg-blue-600 text-white' : 'bg-gray-200'}`}>طلبات الانضمام ({requests.filter(r => r.status === 'pending').length})</button>
                            <button onClick={() => setActiveSubTab("supportChats")} className={`px-4 py-2 rounded font-bold text-sm ${activeSubTab === 'supportChats' ? 'bg-blue-600 text-white' : 'bg-gray-200'}`}>محادثات الطلاب 💬</button>
                            <button onClick={() => signOut(window.auth)} className="bg-red-50 text-red-600 px-4 py-2 rounded font-bold text-sm hover:bg-red-100">خروج</button>
                        </div>
                    </div>

                    {selectedCourseForLectures ? (
                        <AdminLecturesManager course={selectedCourseForLectures} onBack={() => setSelectedCourseForLectures(null)} />
                    ) : activeSubTab === 'promos' ? (
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            <div className="bg-white p-6 rounded-lg shadow border-t-4 border-blue-600 h-fit">
                                <h3 className="font-bold mb-3">إضافة عرض أو إعلان تسويقي</h3>
                                <form onSubmit={handleAddPromo} className="space-y-3">
                                    <input type="text" placeholder="عنوان الإعلان / العرض *" required value={promoTitle} onChange={e => setPromoTitle(e.target.value)} className="w-full px-3 py-2 border rounded outline-none text-sm" />
                                    <div>
                                        <label className="block text-xs font-bold mb-1">نوع المحتوى</label>
                                        <select value={promoType} onChange={e => setPromoType(e.target.value)} className="w-full px-3 py-2 border rounded outline-none text-sm">
                                            <option value="image">صورة إعلان من الاستديو 🖼️</option>
                                            <option value="video">فيديو تسويقي (يوتيوب) 📺</option>
                                            <option value="text">إعلان / عرض نصي 📝</option>
                                        </select>
                                    </div>
                                    {promoType === 'image' ? (
                                        <div><label className="block text-xs font-bold mb-1">صورة الإعلان:</label><input type="file" accept="image/*" onChange={(e) => handleImageUpload(e, setPromoUrl)} className="w-full text-xs border p-2 rounded bg-slate-50" />{promoUrl && <img src={promoUrl} className="w-full h-28 object-cover mt-2 rounded border" />}</div>
                                    ) : promoType === 'video' ? (
                                        <input type="url" placeholder="رابط الفيديو (يوتيوب)" required value={promoUrl} onChange={e => setPromoUrl(e.target.value)} className="w-full px-3 py-2 border rounded outline-none text-sm" dir="ltr" />
                                    ) : (
                                        <textarea placeholder="اكتب نص الإعلان أو العرض هنا..." required value={promoText} onChange={e => setPromoText(e.target.value)} className="w-full px-3 py-2 border rounded outline-none text-sm h-24"></textarea>
                                    )}
                                    <button type="submit" className="w-full bg-blue-600 text-white py-2 rounded font-bold text-sm">نشر الإعلان</button>
                                </form>
                            </div>
                            <div className="lg:col-span-2 space-y-4">
                                <h3 className="text-xl font-bold mb-2">العروض الحالية</h3>
                                {promos.map(p => (
                                    <div key={p.id} className="bg-white p-4 rounded-lg shadow flex justify-between items-start border-r-4 border-blue-500 gap-4">
                                        <div className="flex gap-4 items-center flex-1">
                                            {p.type === 'image' && p.url && <img src={p.url} className="w-20 h-16 object-cover rounded" />}
                                            <div>
                                                <h4 className="font-bold text-blue-900">{p.title} ({p.type === 'image' ? '🖼️ صورة' : p.type === 'video' ? '📺 فيديو' : '📝 نص'})</h4>
                                                {p.type === 'text' ? <p className="text-gray-600 text-sm mt-1 bg-slate-50 p-2 rounded">{p.text}</p> : <a href={p.url} target="_blank" className="text-xs text-blue-500 underline truncate block max-w-md">{p.url}</a>}
                                            </div>
                                        </div>
                                        <div className="flex gap-2">
                                            <button onClick={() => setEditingPromo(p)} className="bg-blue-50 text-blue-700 px-3 py-1 rounded font-bold text-sm">تعديل ✏️</button>
                                            <button onClick={() => handleDeletePromo(p.id)} className="bg-red-50 text-red-600 px-3 py-1 rounded font-bold text-sm">حذف</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    ) : activeSubTab === 'social' ? (
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            <div className="bg-white p-6 rounded-lg shadow border-t-4 border-blue-600 h-fit">
                                <h3 className="font-bold mb-3">إضافة موقع تواصل 🌐</h3>
                                <form onSubmit={handleAddSocialLink} className="space-y-3">
                                    <input type="text" placeholder="اسم المنصة (مثال: تويتر)" required value={socialTitle} onChange={e => setSocialTitle(e.target.value)} className="w-full px-3 py-2 border rounded outline-none text-sm" />
                                    <input type="url" placeholder="الرابط (URL)" required value={socialUrl} onChange={e => setSocialUrl(e.target.value)} className="w-full px-3 py-2 border rounded outline-none text-sm" dir="ltr" />
                                    <div>
                                        <label className="block text-xs font-bold mb-1">الشعار المصغر (من الاستديو):</label>
                                        <input type="file" accept="image/*" onChange={(e) => handleImageUpload(e, setSocialIconUrl)} className="w-full text-xs border p-2 rounded bg-slate-50" />
                                        {socialIconUrl && <img src={socialIconUrl} className="w-12 h-12 object-cover mt-2 rounded-full border border-gray-300 shadow" />}
                                    </div>
                                    <button type="submit" className="w-full bg-blue-600 text-white py-2 rounded font-bold text-sm">إضافة الرابط</button>
                                </form>
                            </div>
                            <div className="lg:col-span-2 space-y-4">
                                <h3 className="text-xl font-bold mb-2">الروابط المضافة</h3>
                                {socialLinks.length === 0 && <p className="text-gray-500 text-sm">لم يتم إضافة روابط تواصل بعد.</p>}
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    {socialLinks.map(link => (
                                        <div key={link.id} className="bg-white p-4 rounded-lg shadow flex items-center justify-between border-r-4 border-indigo-500">
                                            <div className="flex items-center gap-3">
                                                <img src={link.iconUrl} alt={link.title} className="w-10 h-10 object-cover rounded-full border" />
                                                <div>
                                                    <p className="font-bold text-sm">{link.title}</p>
                                                    <a href={link.url} target="_blank" className="text-xs text-blue-500 underline">فتح الرابط</a>
                                                </div>
                                            </div>
                                            <button onClick={() => handleDeleteSocialLink(link.id)} className="text-red-500 font-bold hover:bg-red-50 p-2 rounded">×</button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    ) : activeSubTab === 'requests' ? (
                        <div className="bg-white p-6 rounded-lg shadow">
                            <h2 className="text-xl font-bold mb-4">طلبات انضمام الطلاب للدورات</h2>
                            <div className="space-y-4">
                                {requests.length === 0 && <p className="text-gray-500">لا توجد طلبات انضمام حالياً.</p>}
                                {requests.map(req => (
                                    <div key={req.id} className="p-4 border rounded shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                                        <div>
                                            <p className="font-bold text-blue-900">الطالب: <button onClick={() => handleOpenStudentProfile(req.studentId)} className="text-blue-600 underline hover:text-blue-800 font-extrabold">{req.studentName}</button></p>
                                            <p className="text-sm text-gray-600">الدورة المطلوبة: <span className="font-bold">{req.courseTitle}</span></p>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <button onClick={() => handleOpenStudentProfile(req.studentId)} className="bg-slate-100 text-blue-700 px-3 py-2 rounded font-bold text-xs hover:bg-slate-200">ملف الطالب 👤</button>
                                            {req.status === 'approved' ? (
                                                <span className="bg-green-100 text-green-700 px-3 py-1 rounded font-bold text-sm">مكتمل ومفعل ✅</span>
                                            ) : (
                                                <button onClick={() => handleApproveRequest(req.id, req.studentId, req.courseId)} className="bg-blue-600 text-white px-4 py-2 rounded font-bold text-sm">موافقة وتفعيل</button>
                                            )}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    ) : activeSubTab === 'supportChats' ? (
                        <AdminSupportChatsManager students={students} />
                    ) : (
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            <div className="lg:col-span-1">
                                <div className="bg-white p-6 rounded-lg shadow border-t-4 border-blue-600">
                                    <h2 className="text-lg font-bold mb-4">إضافة دورة جديدة</h2>
                                    <form onSubmit={handleAddCourse} className="space-y-3">
                                        <input type="text" placeholder="اسم الدورة *" required value={title} onChange={e => setTitle(e.target.value)} className="w-full px-3 py-2 border rounded outline-none" />
                                        <input type="text" placeholder="المدرب *" required value={instructor} onChange={e => setInstructor(e.target.value)} className="w-full px-3 py-2 border rounded outline-none" />
                                        <input type="text" placeholder="مدة الدورة *" required value={duration} onChange={e => setDuration(e.target.value)} className="w-full px-3 py-2 border rounded outline-none" />

            const [replyText, setReplyText] = useState("");
            const studentList = students.filter(s => s.role === 'student');

            useEffect(() => {
                if (!selectedStudent) return;
                const q = query(collection(window.db, "users", selectedStudent.id, "supportChat"), orderBy("createdAt", "asc"));
                const unsub = onSnapshot(q, (snap) => setMessages(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                return () => unsub();
            }, [selectedStudent]);

            const handleSendReply = async (e) => {
                e.preventDefault();
                if (!replyText.trim() || !selectedStudent) return;
                await addDoc(collection(window.db, "users", selectedStudent.id, "supportChat"), { sender: "admin", text: replyText, createdAt: new Date().toISOString() });
                setReplyText("");
            };

            return (
                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 bg-white p-6 rounded-lg shadow min-h-[500px]">

                            <div className="flex justify-center gap-4 flex-wrap">
                                {socialLinks.map(link => (
                                    <a key={link.id} href={link.url} target="_blank" title={link.title} className="hover:opacity-80 transition transform hover:-translate-y-1 block">
                                        <img src={link.iconUrl} alt={link.title} className="w-10 h-10 object-cover rounded-full border shadow-sm" />
                                    </a>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* نافذة معاينة تفاصيل الدورة قبل الانضمام */}
                    {previewCourseModal && !paymentInfoModal && (
                        <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50 overflow-y-auto">
                            <div className="bg-white p-6 rounded-2xl shadow-2xl max-w-2xl w-full space-y-4 relative border-t-4 border-blue-600 max-h-[90vh] overflow-y-auto">
                                <button onClick={() => setPreviewCourseModal(null)} className="absolute top-4 left-4 text-gray-400 hover:text-black font-bold text-2xl">×</button>
                                <h2 className="text-2xl font-bold text-blue-900 border-b pb-2">{previewCourseModal.title}</h2>
                                {previewCourseModal.previewVideoUrl ? (
                                    <div className="w-full h-64 bg-black rounded-lg overflow-hidden shadow"><iframe src={getEmbedUrl(previewCourseModal.previewVideoUrl)} className="w-full h-full" allowFullScreen></iframe></div>
                                ) : previewCourseModal.imageUrl ? <img src={previewCourseModal.imageUrl} className="w-full h-48 object-cover rounded-lg shadow" /> : null}
                                <div className="grid grid-cols-2 gap-4 bg-slate-50 p-3 rounded-lg text-sm">
                                    <p><strong>المدرب:</strong> {previewCourseModal.instructor}</p><p><strong>مدة الدورة:</strong> {previewCourseModal.duration}</p>
                                    <p><strong>الفئة:</strong> {previewCourseModal.targetAudience}</p><p><strong>السعر:</strong> <span className="text-green-600 font-bold text-lg">{previewCourseModal.price}</span></p>
                                </div>
                                <div>
                                    <h4 className="font-bold text-blue-900 mb-1">الوصف التفصيلي:</h4>
                                    <p className="text-gray-700 text-sm leading-relaxed bg-slate-50 p-4 rounded-lg">{previewCourseModal.desc || 'لا يوجد وصف مضاف.'}</p>
                                </div>
                                <div className="pt-2">
                                    {enrolledCourseIds.includes(previewCourseModal.id) ? (
                                        <button onClick={() => { setSelectedCourse(previewCourseModal); setPreviewCourseModal(null); }} className="w-full bg-green-600 text-white py-3 rounded-xl font-bold">دخول محتوى الدورة 🎓</button>
                                    ) : myRequests[previewCourseModal.id] === 'pending' ? (
                                        <button disabled className="w-full bg-yellow-100 text-yellow-800 py-3 rounded-xl font-bold cursor-not-allowed">طلب الانضمام قيد المراجعة ⏳</button>
                                    ) : (
                                        <button onClick={() => { handleRequestEnrollment(previewCourseModal); setPreviewCourseModal(null); }} className="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-bold shadow-lg text-lg flex items-center justify-center gap-2">طلب الانضمام للدورة 🚀</button>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* رسالة الدفع وتفاصيل الحساب البنكي (نافذة منبثقة) */}
                    {paymentInfoModal && (
                        <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-[70]">
                            <div className="bg-white p-6 rounded-2xl shadow-2xl max-w-md w-full relative border-t-4 border-green-600 text-center">
                                <button onClick={() => setPaymentInfoModal(null)} className="absolute top-4 left-4 text-gray-400 hover:text-black font-bold text-2xl">×</button>
                                <h2 className="text-2xl font-bold text-green-700 mb-4">تم تسجيل طلبك بنجاح! 🎉</h2>
                                <div className="bg-slate-50 p-4 rounded-lg text-gray-700 space-y-3 text-sm leading-relaxed text-right">
                                    <p>لفتح الدورة المسجلة، يتم تحويل مبلغ الدورة <span className="font-bold text-green-600">({paymentInfoModal.price})</span> للمنصة على رقم الحساب التالي:</p>
                                    
                                    <div className="bg-white border p-3 rounded text-center">
                                        <p className="font-bold text-blue-900">مركز إبداع ومواهب للتدريب</p>
                                        <p className="font-mono text-lg font-bold select-all mt-1" title="اضغط للنسخ">SA1080000216608016625329</p>
                                    </div>
                                    
                                    <p>وإرسال الإيصال للمنصة عبر الواتساب على الرقم:</p>
                                    <a href={`https://wa.me/966510785633?text=مرحباً، أرفق لكم إيصال سداد دورة: ${paymentInfoModal.title}`} target="_blank" className="block text-center text-lg font-bold text-green-600 hover:underline select-all" title="اضغط لفتح الواتساب">0510785633</a>
                                    
                                    <p className="font-bold text-blue-800 text-center mt-2">وسيتم فتح الدورة لكم آلياً.</p>
                                </div>
                                <button onClick={() => setPaymentInfoModal(null)} className="mt-4 w-full bg-green-600 text-white py-2 rounded-xl font-bold">حسناً، فهمت</button>
                            </div>
                        </div>
                    )}

                    {/* نافذة عرض تفاصيل الإعلان الكاملة */}
                    {selectedPromoModal && (
                        <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
                            <div className="bg-white p-6 rounded-2xl shadow-2xl max-w-lg w-full space-y-4 relative border-t-4 border-teal-600 max-h-[90vh] overflow-y-auto">
                                <button onClick={() => setSelectedPromoModal(null)} className="absolute top-4 left-4 text-gray-400 hover:text-black font-bold text-2xl">×</button>
                                <h3 className="text-2xl font-bold text-blue-900 border-b pb-2">{selectedPromoModal.title}</h3>
                                {selectedPromoModal.type === 'image' ? <img src={selectedPromoModal.url} className="w-full h-72 object-cover rounded-lg shadow" /> : selectedPromoModal.type === 'video' ? <div className="w-full h-64 bg-black rounded-lg overflow-hidden shadow"><iframe src={getEmbedUrl(selectedPromoModal.url)} className="w-full h-full" allowFullScreen></iframe></div> : <p className="text-gray-700 text-base bg-slate-50 p-4 rounded-lg leading-relaxed whitespace-pre-wrap">{selectedPromoModal.text}</p>}
                                <button onClick={() => setSelectedPromoModal(null)} className="w-full bg-blue-600 text-white py-2 rounded-xl font-bold">إغلاق</button>
                            </div>
                        </div>
                    )}

                    {/* فقاعة محادثة الدعم الفني المعلقة */}
                    <div className="fixed bottom-6 left-6 z-50">
                        {showSupportChat ? (
                            <div className="bg-white rounded-lg shadow-2xl border border-blue-200 w-80 flex flex-col h-96">
                                <div className="bg-blue-600 text-white p-3 rounded-t-lg flex justify-between items-center">
                                    <span className="font-bold text-sm">💬 محادثة الدعم الفني</span>
                                    <button onClick={() => setShowSupportChat(false)} className="text-white hover:bg-blue-700 rounded px-2 font-bold text-lg">×</button>
                                </div>
                                <StudentCloudChat user={user} />
                            </div>
                        ) : (
                            <button onClick={() => { setShowSupportChat(true); setHasNewAdminMessage(false); }} className="relative bg-blue-600 hover:bg-blue-700 text-white p-4 rounded-full shadow-2xl flex items-center justify-center transition transform hover:scale-105">
                                {hasNewAdminMessage && (
                                    <span className="absolute -top-1 -right-1 flex h-5 w-5">
                                        <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                                        <span className="relative inline-flex rounded-full h-5 w-5 bg-red-600 border-2 border-white"></span>
                                    </span>
                                )}
                                <span className="font-bold flex items-center gap-2">💬 الدعم الفني</span>
                            </button>
                        )}
                    </div>
                </div>
            );
        }

        function StudentCloudChat({ user }) {
            const [messages, setMessages] = useState([]);
            const [text, setText] = useState("");

            useEffect(() => {
                const q = query(collection(window.db, "users", user.uid, "supportChat"), orderBy("createdAt", "asc"));
                const unsub = onSnapshot(q, (snap) => setMessages(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                return () => unsub();
            }, [user.uid]);

            const handleSend = async (e) => {
                e.preventDefault();
                if (!text.trim()) return;
                await addDoc(collection(window.db, "users", user.uid, "supportChat"), { sender: "student", text: text, createdAt: new Date().toISOString() });
                setText("");
            };

            return (
                <div className="flex flex-col flex-1 p-3 overflow-hidden bg-slate-50 rounded-b-lg">
                    <div className="flex-1 overflow-y-auto space-y-2 mb-2 p-1 text-xs">
                        {messages.length === 0 && <p className="text-gray-400 text-center mt-10">أهلاً بك! اكتب استفسارك للإدارة وسنرد عليك هنا.</p>}
                        {messages.map(m => (
                            <div key={m.id} className={`p-2.5 rounded-lg max-w-[85%] shadow-sm ${m.sender === 'student' ? 'bg-blue-600 text-white mr-auto rounded-tr-none' : 'bg-white border text-gray-800 ml-auto rounded-tl-none'}`}>
                                <span className="block font-bold text-[9px] opacity-75 mb-0.5">{m.sender === 'student' ? 'أنت' : 'الإدارة 👑'}</span>
                                {m.text}
                            </div>
                        ))}
                    </div>
                    <form onSubmit={handleSend} className="flex gap-2 border-t border-gray-200 pt-3">
                        <input type="text" value={text} onChange={e => setText(e.target.value)} placeholder="اكتب رسالتك..." className="flex-1 px-3 py-2 border rounded-full text-xs outline-none focus:ring-1 focus:ring-blue-500" />
                        <button type="submit" className="bg-blue-600 text-white px-4 py-2 rounded-full text-xs font-bold hover:bg-blue-700">إرسال</button>
                    </form>
                </div>
            );
        }

        function CompleteProfile({ user, onComplete }) {
            const [fullName, setFullName] = useState("");
            const [city, setCity] = useState("");
            const [phone, setPhone] = useState("");
            const [grade, setGrade] = useState("");
            const [mawhiba, setMawhiba] = useState("نعم");

            const handleSubmit = async (e) => {
                e.preventDefault();
                const data = { fullName, city, phone, grade, mawhiba, profileComplete: true };
                await updateDoc(doc(window.db, "users", user.uid), data);
                onComplete(data);
            };

            return (
                <div className="flex items-center justify-center min-h-screen p-4 bg-slate-100">
                    <form onSubmit={handleSubmit} className="bg-white p-8 rounded-xl shadow-lg w-full max-w-md space-y-4 border-t-4 border-blue-600">
                        <h2 className="text-2xl font-bold text-blue-800 text-center">أكمل ملفك الشخصي 📝</h2>
                        <div><label className="block text-sm font-bold mb-1">الاسم الكامل</label><input type="text" required value={fullName} onChange={e => setFullName(e.target.value)} className="w-full px-3 py-2 border rounded outline-none" /></div>
                        <div><label className="block text-sm font-bold mb-1">المدينة</label><input type="text" required value={city} onChange={e => setCity(e.target.value)} className="w-full px-3 py-2 border rounded outline-none" /></div>
                        <div><label className="block text-sm font-bold mb-1">رقم التواصل</label><input type="tel" required value={phone} onChange={e => setPhone(e.target.value)} className="w-full px-3 py-2 border rounded outline-none" /></div>
                        <div><label className="block text-sm font-bold mb-1">الصف الدراسي</label><input type="text" required value={grade} onChange={e => setGrade(e.target.value)} className="w-full px-3 py-2 border rounded outline-none" /></div>
                        <div><label className="block text-sm font-bold mb-1">موهبة</label><select value={mawhiba} onChange={e => setMawhiba(e.target.value)} className="w-full px-3 py-2 border rounded outline-none"><option value="نعم">نعم</option><option value="لا">لا</option></select></div>
                        <button type="submit" className="w-full bg-blue-600 text-white py-2 rounded font-bold">حفظ والانتقال</button>
                    </form>
                </div>
            );
        }

        function StudentProfileView({ user, profile, onUpdate }) {
            const [isEditing, setIsEditing] = useState(false);
            const [fullName, setFullName] = useState(profile?.fullName || "");
            const [city, setCity] = useState(profile?.city || "");
            const [phone, setPhone] = useState(profile?.phone || "");
            const [grade, setGrade] = useState(profile?.grade || "");
            const [mawhiba, setMawhiba] = useState(profile?.mawhiba || "نعم");

            const handleSave = async (e) => {
                e.preventDefault();
                const updatedData = { fullName, city, phone, grade, mawhiba, profileComplete: true };
                await updateDoc(doc(window.db, "users", user.uid), updatedData);
                onUpdate(updatedData);
                setIsEditing(false);
            };

            return (
                <div className="bg-white p-6 rounded-lg shadow max-w-md mx-auto border-t-4 border-blue-600 space-y-4">
                    <div className="flex justify-between items-center border-b pb-2">
                        <h2 className="text-xl font-bold text-blue-900">ملف الطالب الشخصي 👤</h2>
                        {!isEditing && <button onClick={() => setIsEditing(true)} className="bg-blue-50 text-blue-700 px-3 py-1 rounded font-bold text-xs">تعديل ✏️</button>}
                    </div>
                    {isEditing ? (
                        <form onSubmit={handleSave} className="space-y-3">
                            <input type="text" required value={fullName} onChange={e => setFullName(e.target.value)} className="w-full px-3 py-2 border rounded text-sm" placeholder="الاسم" />
                            <input type="text" required value={city} onChange={e => setCity(e.target.value)} className="w-full px-3 py-2 border rounded text-sm" placeholder="المدينة" />
                            <input type="tel" required value={phone} onChange={e => setPhone(e.target.value)} className="w-full px-3 py-2 border rounded text-sm" placeholder="الهاتف" />
                            <input type="text" required value={grade} onChange={e => setGrade(e.target.value)} className="w-full px-3 py-2 border rounded text-sm" placeholder="الصف" />
                            <button type="submit" className="w-full bg-blue-600 text-white py-2 rounded font-bold text-sm">حفظ التعديلات</button>
                        </form>
                    ) : (
                        <div className="space-y-2">
                            <p><strong>رقم التسجيل:</strong> <span className="text-xs bg-slate-100 p-1 rounded font-mono select-all">{user.uid}</span></p>
                            <p><strong>الاسم:</strong> {profile?.fullName}</p>
                            <p><strong>المدينة:</strong> {profile?.city}</p>
                            <p><strong>الهاتف:</strong> {profile?.phone}</p>
                            <p><strong>الصف:</strong> {profile?.grade}</p>
                            <p><strong>موهبة:</strong> {profile?.mawhiba}</p>
                        </div>
                    )}
                </div>
            );
        }

        function StudentCourseView({ course, user, profile, onBack }) {
            const [lectures, setLectures] = useState([]);
            const [activeLecture, setActiveLecture] = useState(null);
            const [comments, setComments] = useState([]);
            const [newComment, setNewComment] = useState("");

            useEffect(() => {
                const q = query(collection(window.db, "courses", course.id, "lectures"), orderBy("createdAt", "asc"));
                const unsub = onSnapshot(q, (snap) => {
                    const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    setLectures(list);
                    if (list.length > 0 && !activeLecture) setActiveLecture(list[0]);
                });
                return () => unsub();
            }, [course.id]);

            useEffect(() => {
                if (!activeLecture) return;
                const qComm = query(collection(window.db, "courses", course.id, "lectures", activeLecture.id, "comments"), orderBy("createdAt", "asc"));
                const unsubComm = onSnapshot(qComm, (snap) => setComments(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                return () => unsubComm();
            }, [course.id, activeLecture]);

            const handleAddComment = async (e) => {
                e.preventDefault();
                if (!newComment.trim()) return;
                await addDoc(collection(window.db, "courses", course.id, "lectures", activeLecture.id, "comments"), { userId: user.uid, userName: profile?.fullName || user.email.split('@')[0], text: newComment, isAdminReply: false, createdAt: new Date().toISOString() });
                setNewComment("");
            };

            return (
                <div>
                    <button onClick={onBack} className="mb-4 bg-gray-200 text-gray-700 px-4 py-2 rounded font-bold text-sm">← العودة</button>
                    <div className="bg-white p-6 rounded-lg shadow mb-6">
                        <h2 className="text-2xl font-bold text-blue-900 mb-2">{course.title}</h2>
                        <p className="text-gray-600">{course.desc}</p>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="lg:col-span-1 bg-white p-4 rounded-lg shadow h-fit">
                            <h3 className="font-bold border-b pb-2 mb-3">حلقات الدورة 📺</h3>
                            <div className="space-y-2">
                                {lectures.map((lec, idx) => (
                                    <button key={lec.id} onClick={() => setActiveLecture(lec)} className={`w-full text-right p-3 rounded font-bold text-sm ${activeLecture?.id === lec.id ? 'bg-blue-600 text-white' : 'bg-gray-50 hover:bg-gray-100 text-gray-700'}`}>
                                        {idx + 1}. {lec.title}
                                    </button>
                                ))}
                            </div>
                        </div>
                        <div className="lg:col-span-2 bg-white p-6 rounded-lg shadow space-y-4">
                            {activeLecture ? (
                                <>
                                    <h3 className="text-xl font-bold text-blue-900">{activeLecture.title}</h3>
                                    <p className="text-gray-700 bg-slate-50 p-4 rounded">{activeLecture.content}</p>
                                    {activeLecture.videoUrl && <div className="border p-2 rounded bg-black"><iframe src={getEmbedUrl(activeLecture.videoUrl)} className="w-full h-72" allowFullScreen></iframe></div>}
                                    <div className="border-t pt-4 mt-6">
                                        <h4 className="font-bold mb-3">التعليقات التفاعلية 💬</h4>
                                        <div className="space-y-3 mb-4 max-h-60 overflow-y-auto">
                                            {comments.map(c => (
                                                <div key={c.id} className={`p-3 rounded text-sm ${c.isAdminReply ? 'bg-blue-50 border-r-4 border-blue-600 mr-6' : 'bg-gray-100'}`}><span className="font-bold block text-xs text-blue-800 mb-1">{c.userName} {c.isAdminReply && '(الإدارة 👑)'}</span>{c.text}</div>
                                            ))}
                                        </div>
                                        <form onSubmit={handleAddComment} className="flex gap-2">
                                            <input type="text" value={newComment} onChange={e => setNewComment(e.target.value)} className="flex-1 px-3 py-2 border rounded outline-none text-sm" placeholder="اكتب تعليقك..." />
                                            <button type="submit" className="bg-blue-600 text-white px-4 py-2 rounded font-bold text-sm">إرسال</button>
                                        </form>
                                    </div>
                                </>
                            ) : <p className="text-gray-400 text-center py-20">اختر حلقة لبدء المشاهدة</p>}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
