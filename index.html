<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة إبداع التعليمية</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, setDoc, getDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDwSZe5sUglFRmXKbGLqtS6_5qO1r5wf9o",
            authDomain: "ibda3-91fde.firebaseapp.com",
            projectId: "ibda3-91fde",
            storageBucket: "ibda3-91fde.firebasestorage.app",
            messagingSenderId: "203097189746",
            appId: "1:203097189746:web:af3a59c8eee851663881eb"
        };

        const app = initializeApp(firebaseConfig);
        window.auth = getAuth(app);
        window.db = getFirestore(app);
        window.firebaseAPI = {
            onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut,
            collection, addDoc, doc, setDoc, getDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy
        };
    </script>
</head>
<body class="bg-slate-50 font-sans text-gray-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { 
            onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut,
            doc, setDoc, getDoc, updateDoc, collection, addDoc, deleteDoc, onSnapshot, query, orderBy 
        } = window.firebaseAPI;

        function App() {
            const [user, setUser] = useState(null);
            const [role, setRole] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const unsubscribe = onAuthStateChanged(window.auth, async (currentUser) => {
                    setUser(currentUser);
                    if (currentUser) {
                        try {
                            const userDoc = await getDoc(doc(window.db, "users", currentUser.uid));
                            if (userDoc.exists()) {
                                setRole(userDoc.data().role);
                            } else {
                                setRole("student");
                            }
                        } catch (error) {
                            setRole("student");
                        }
                    } else {
                        setRole(null);
                    }
                    setLoading(false);
                });
                return () => unsubscribe();
            }, []);

            if (loading) return <div className="flex items-center justify-center min-h-screen text-blue-600 font-bold text-xl">جاري تحميل منصة إبداع...</div>;

            if (!user) return <Login />;
            if (role === "super_admin" || role === "admin") return <AdminDashboard user={user} role={role} />;
            return <StudentDashboard user={user} />;
        }

        // --- تسجيل الدخول ---
        function Login() {
            const [username, setUsername] = useState("");
            const [password, setPassword] = useState("");
            const [isRegister, setIsRegister] = useState(false);
            const [error, setError] = useState("");
            const [loading, setLoading] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError(""); setLoading(true);
                const email = username.trim().toLowerCase() + "@ebdaa.com";

                try {
                    if (isRegister) {
                        if (password.length < 6) {
                            setError("كلمة المرور يجب ألا تقل عن 6 أحرف");
                            setLoading(false);
                            return;
                        }
                        const userCredential = await createUserWithEmailAndPassword(window.auth, email, password);
                        await setDoc(doc(window.db, "users", userCredential.user.uid), {
                            username: username.trim(),
                            role: "student",
                            profileComplete: false,
                            createdAt: new Date().toISOString()
                        });
                    } else {
                        await signInWithEmailAndPassword(window.auth, email, password);
                    }
                } catch (err) {
                    setError("بيانات الدخول غير صحيحة أو الحساب مسجل مسبقاً.");
                }
                setLoading(false);
            };

            return (
                <div className="flex items-center justify-center min-h-screen p-4 bg-slate-100">
                    <div className="bg-white p-8 rounded-xl shadow-lg w-full max-w-sm border-t-4 border-blue-600 relative">
                        <div className="flex items-center gap-3 mb-6 border-b pb-4">
                            <img src="https://i.ibb.co/3m1R0Vb/image.png" alt="شعار إبداع" className="w-12 h-12 object-cover rounded-full border border-teal-500" onError={(e)=>{e.target.style.display='none'}} />
                            <div>
                                <h2 className="text-xl font-bold text-blue-800">منصة إبداع 💡</h2>
                                <h3 className="text-gray-500 text-xs">{isRegister ? "إنشاء حساب طالب جديد" : "تسجيل الدخول"}</h3>
                            </div>
                        </div>

                        {error && <p className="text-red-500 text-sm mb-4 text-center font-bold bg-red-50 p-2 rounded">{error}</p>}
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-gray-700 text-sm font-bold mb-1">اسم المستخدم</label>
                                <input type="text" required value={username} onChange={(e) => setUsername(e.target.value)} className="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" />
                            </div>
                            <div>
                                <label className="block text-gray-700 text-sm font-bold mb-1">كلمة المرور</label>
                                <input type="password" required value={password} onChange={(e) => setPassword(e.target.value)} className="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" />
                            </div>
                            <button type="submit" disabled={loading} className="w-full bg-blue-600 text-white py-2 rounded-lg font-bold hover:bg-blue-700 transition">
                                {loading ? "جاري المعالجة..." : (isRegister ? "إنشاء الحساب" : "تسجيل الدخول")}
                            </button>
                        </form>
                        <button onClick={() => { setIsRegister(!isRegister); setError(""); }} className="w-full text-sm text-blue-600 mt-4 font-medium hover:underline text-center">
                            {isRegister ? "لديك حساب بالفعل؟ سجل دخولك" : "ليس لديك حساب؟ أنشئ حساباً جديداً"}
                        </button>
                    </div>
                </div>
            );
        }

        // --- لوحة الإدارة ---
        function AdminDashboard({ user, role }) {
            const [activeSubTab, setActiveSubTab] = useState("courses");
            const [courses, setCourses] = useState([]);
            const [requests, setRequests] = useState([]);
            const [students, setStudents] = useState([]);
            const [promos, setPromos] = useState([]);
            const [selectedCourseForLectures, setSelectedCourseForLectures] = useState(null);
            const [viewingStudentModal, setViewingStudentModal] = useState(null); // نافذة عرض ملف الطالب المقدم للطلب
            
            // نماذج إضافة دورة
            const [title, setTitle] = useState("");
            const [duration, setDuration] = useState("");
            const [price, setPrice] = useState("");
            const [targetAudience, setTargetAudience] = useState("");
            const [instructor, setInstructor] = useState("");
            const [desc, setDesc] = useState("");
            const [imageUrl, setImageUrl] = useState("");

            // نموذج إضافة إعلان تسويقي
            const [promoTitle, setPromoTitle] = useState("");
            const [promoType, setPromoType] = useState("image");
            const [promoUrl, setPromoUrl] = useState("");

            useEffect(() => {
                const q = query(collection(window.db, "courses"), orderBy("createdAt", "desc"));
                const unsubscribe = onSnapshot(q, (snapshot) => {
                    setCourses(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                const qReq = query(collection(window.db, "enrollmentRequests"), orderBy("createdAt", "desc"));
                const unsubReq = onSnapshot(qReq, (snapshot) => {
                    setRequests(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });
                return () => unsubReq();
            }, []);

            useEffect(() => {
                const unsubStudents = onSnapshot(collection(window.db, "users"), (snapshot) => {
                    setStudents(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });
                return () => unsubStudents();
            }, []);

            useEffect(() => {
                const unsubPromos = onSnapshot(collection(window.db, "promos"), (snapshot) => {
                    setPromos(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });
                return () => unsubPromos();
            }, []);

            const handleAddCourse = async (e) => {
                e.preventDefault();
                await addDoc(collection(window.db, "courses"), {
                    title, duration, price, targetAudience, instructor, desc, imageUrl,
                    createdAt: new Date().toISOString()
                });
                setTitle(""); setDuration(""); setPrice(""); setTargetAudience(""); setInstructor(""); setDesc(""); setImageUrl("");
            };

            const handleDeleteCourse = async (id) => {
                if (confirm("هل أنت متأكد من حذف هذه الدورة؟")) {
                    await deleteDoc(doc(window.db, "courses", id));
                }
            };

            const handleAddPromo = async (e) => {
                e.preventDefault();
                await addDoc(collection(window.db, "promos"), {
                    title: promoTitle,
                    type: promoType,
                    url: promoUrl,
                    createdAt: new Date().toISOString()
                });
                setPromoTitle(""); setPromoUrl("");
            };

            const handleDeletePromo = async (id) => {
                await deleteDoc(doc(window.db, "promos", id));
            };

            const handleApproveRequest = async (reqId, studentId, courseId) => {
                await setDoc(doc(window.db, "users", studentId, "enrolledCourses", courseId), {
                    enrolledAt: new Date().toISOString()
                });
                await updateDoc(doc(window.db, "enrollmentRequests", reqId), {
                    status: "approved"
                });
            };

            const handleOpenStudentProfile = async (studentId) => {
                const docSnap = await getDoc(doc(window.db, "users", studentId));
                if (docSnap.exists()) {
                    setViewingStudentModal(docSnap.data());
                } else {
                    alert("لم يتم العثور على ملف الطالب.");
                }
            };

            return (
                <div className="p-4 md:p-8 max-w-7xl mx-auto">
                    <div className="flex flex-col sm:flex-row justify-between items-center border-b pb-4 mb-6 gap-4">
                        <div className="flex items-center gap-3">
                            <img src="https://i.ibb.co/3m1R0Vb/image.png" alt="شعار إبداع" className="w-12 h-12 object-cover rounded-full border-2 border-teal-600 shadow" />
                            <div>
                                <h1 className="text-2xl font-bold text-blue-800">لوحة الإدارة ⚙️</h1>
                                <p className="text-sm text-gray-500">منصّة إبداع التعليمية</p>
                            </div>
                        </div>
                        <div className="flex flex-wrap gap-2">
                            <button onClick={() => { setActiveSubTab("courses"); setSelectedCourseForLectures(null); }} className={`px-4 py-2 rounded font-bold text-sm ${activeSubTab === 'courses' ? 'bg-blue-600 text-white' : 'bg-gray-200'}`}>إدارة الدورات</button>
                            <button onClick={() => setActiveSubTab("promos")} className={`px-4 py-2 rounded font-bold text-sm ${activeSubTab === 'promos' ? 'bg-blue-600 text-white' : 'bg-gray-200'}`}>الإعلانات والفيديوهات 📢</button>
                            <button onClick={() => setActiveSubTab("requests")} className={`px-4 py-2 rounded font-bold text-sm ${activeSubTab === 'requests' ? 'bg-blue-600 text-white' : 'bg-gray-200'}`}>طلبات الانضمام ({requests.filter(r => r.status === 'pending').length})</button>
                            <button onClick={() => setActiveSubTab("supportChats")} className={`px-4 py-2 rounded font-bold text-sm ${activeSubTab === 'supportChats' ? 'bg-blue-600 text-white' : 'bg-gray-200'}`}>محادثات الطلاب 💬</button>
                            <button onClick={() => signOut(window.auth)} className="bg-red-50 text-red-600 px-4 py-2 rounded font-bold text-sm hover:bg-red-100">خروج</button>
                        </div>
                    </div>

                    {selectedCourseForLectures ? (
                        <AdminLecturesManager course={selectedCourseForLectures} onBack={() => setSelectedCourseForLectures(null)} />
                    ) : activeSubTab === 'promos' ? (
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            <div className="bg-white p-6 rounded-lg shadow border-t-4 border-blue-600 h-fit">
                                <h3 className="font-bold mb-3">إضافة إعلان أو فيديو تسويقي</h3>
                                <form onSubmit={handleAddPromo} className="space-y-3">
                                    <input type="text" placeholder="عنوان الإعلان أو الفيديو *" required value={promoTitle} onChange={e => setPromoTitle(e.target.value)} className="w-full px-3 py-2 border rounded outline-none text-sm" />
                                    <div>
                                        <label className="block text-xs font-bold mb-1">نوع المحتوى</label>
                                        <select value={promoType} onChange={e => setPromoType(e.target.value)} className="w-full px-3 py-2 border rounded outline-none text-sm">
                                            <option value="image">صورة إعلان 🖼️</option>
                                            <option value="video">فيديو تسويقي 📺</option>
                                        </select>
                                    </div>
                                    <input type="url" placeholder={promoType === 'image' ? 'رابط الصورة' : 'رابط الفيديو (يوتيوب)'} required value={promoUrl} onChange={e => setPromoUrl(e.target.value)} className="w-full px-3 py-2 border rounded outline-none text-sm" dir="ltr" />
                                    <button type="submit" className="w-full bg-blue-600 text-white py-2 rounded font-bold text-sm">نشر في الصفحة الرئيسية</button>
                                </form>
                            </div>
                            <div className="lg:col-span-2 space-y-4">
                                <h3 className="text-xl font-bold mb-2">المحتوى التسويقي الحالي ({promos.length})</h3>
                                {promos.map(p => (
                                    <div key={p.id} className="bg-white p-4 rounded-lg shadow flex justify-between items-center border-r-4 border-blue-500">
                                        <div>
                                            <h4 className="font-bold text-blue-900">{p.title} ({p.type === 'image' ? '🖼️ صورة إعلان' : '📺 فيديو تسويقي'})</h4>
                                            <a href={p.url} target="_blank" className="text-xs text-blue-500 underline truncate block max-w-md">{p.url}</a>
                                        </div>
                                        <button onClick={() => handleDeletePromo(p.id)} className="bg-red-50 text-red-600 px-3 py-1 rounded font-bold text-sm">حذف</button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    ) : activeSubTab === 'requests' ? (
                        <div className="bg-white p-6 rounded-lg shadow">
                            <h2 className="text-xl font-bold mb-4">طلبات انضمام الطلاب للدورات</h2>
                            <div className="space-y-4">
                                {requests.length === 0 && <p className="text-gray-500">لا توجد طلبات انضمام حالياً.</p>}
                                {requests.map(req => (
                                    <div key={req.id} className="p-4 border rounded shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                                        <div>
                                            <p className="font-bold text-blue-900">
                                                الطالب: <button onClick={() => handleOpenStudentProfile(req.studentId)} className="text-blue-600 underline hover:text-blue-800 font-extrabold">{req.studentName}</button>
                                            </p>
                                            <p className="text-sm text-gray-600">الدورة المطلوبة: <span className="font-bold">{req.courseTitle}</span></p>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <button onClick={() => handleOpenStudentProfile(req.studentId)} className="bg-slate-100 text-blue-700 px-3 py-2 rounded font-bold text-xs hover:bg-slate-200">عرض ملف الطالب 👤</button>
                                            {req.status === 'approved' ? (
                                                <span className="bg-green-100 text-green-700 px-3 py-1 rounded font-bold text-sm">تمت الموافقة ✅</span>
                                            ) : (
                                                <button onClick={() => handleApproveRequest(req.id, req.studentId, req.courseId)} className="bg-blue-600 text-white px-4 py-2 rounded font-bold text-sm">موافقة وتفعيل</button>
                                            )}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    ) : activeSubTab === 'supportChats' ? (
                        <AdminSupportChatsManager students={students} />
                    ) : (
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            <div className="lg:col-span-1">
                                <div className="bg-white p-6 rounded-lg shadow border-t-4 border-blue-600">
                                    <h2 className="text-lg font-bold mb-4">إضافة دورة جديدة</h2>
                                    <form onSubmit={handleAddCourse} className="space-y-3">
                                        <input type="text" placeholder="اسم الدورة *" required value={title} onChange={e => setTitle(e.target.value)} className="w-full px-3 py-2 border rounded outline-none" />
                                        <input type="text" placeholder="المدرب *" required value={instructor} onChange={e => setInstructor(e.target.value)} className="w-full px-3 py-2 border rounded outline-none" />
                                        <input type="text" placeholder="مدة الدورة *" required value={duration} onChange={e => setDuration(e.target.value)} className="w-full px-3 py-2 border rounded outline-none" />
                                        <input type="text" placeholder="سعر الدورة *" required value={price} onChange={e => setPrice(e.target.value)} className="w-full px-3 py-2 border rounded outline-none" />
                                        <input type="text" placeholder="الفئة المستهدفة *" required value={targetAudience} onChange={e => setTargetAudience(e.target.value)} className="w-full px-3 py-2 border rounded outline-none" />
                                        <textarea placeholder="وصف الدورة" value={desc} onChange={e => setDesc(e.target.value)} className="w-full px-3 py-2 border rounded outline-none h-20"></textarea>
                                        <input type="url" placeholder="رابط صورة الغلاف" value={imageUrl} onChange={e => setImageUrl(e.target.value)} className="w-full px-3 py-2 border rounded outline-none text-left" dir="ltr" />
                                        <button type="submit" className="w-full bg-blue-600 text-white py-2 rounded font-bold hover:bg-blue-700">نشر الدورة</button>
                                    </form>
                                </div>
                            </div>

                            <div className="lg:col-span-2">
                                <h2 className="text-xl font-bold mb-4">الدورات الحالية ({courses.length})</h2>
                                <div className="space-y-4">
                                    {courses.map(course => (
                                        <div key={course.id} className="bg-white p-4 rounded-lg shadow flex justify-between items-center border-r-4 border-blue-500">
                                            <div className="flex gap-4 items-center">
                                                {course.imageUrl && <img src={course.imageUrl} className="w-20 h-16 object-cover rounded" />}
                                                <div>
                                                    <h3 className="font-bold text-lg text-blue-900">{course.title}</h3>
                                                    <p className="text-sm text-gray-500">المدرب: {course.instructor} | السعر: <span className="text-green-600 font-bold">{course.price}</span></p>
                                                </div>
                                            </div>
                                            <div className="flex gap-2">
                                                <button onClick={() => setSelectedCourseForLectures(course)} className="bg-blue-50 text-blue-700 px-3 py-2 rounded font-bold text-sm">الحلقات 📺</button>
                                                <button onClick={() => handleDeleteCourse(course.id)} className="bg-red-50 text-red-600 px-3 py-2 rounded font-bold text-sm">حذف</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* نافذة عرض ملف الطالب */}
                    {viewingStudentModal && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
                            <div className="bg-white p-6 rounded-xl shadow-2xl max-w-md w-full space-y-4 relative border-t-4 border-blue-600">
                                <button onClick={() => setViewingStudentModal(null)} className="absolute top-4 left-4 text-gray-400 hover:text-black font-bold text-xl">×</button>
                                <h3 className="text-xl font-bold text-blue-900 border-b pb-2">ملف الطالب الشخصي 👤</h3>
                                <div className="space-y-2 text-sm">
                                    <p><strong>اسم المستخدم:</strong> {viewingStudentModal.username}</p>
                                    <p><strong>الاسم الكامل:</strong> {viewingStudentModal.fullName || 'غير محدد'}</p>
                                    <p><strong>المدينة:</strong> {viewingStudentModal.city || 'غير محدد'}</p>
                                    <p><strong>رقم التواصل:</strong> {viewingStudentModal.phone || 'غير محدد'}</p>
                                    <p><strong>الصف الدراسي:</strong> {viewingStudentModal.grade || 'غير محدد'}</p>
                                    <p><strong>المشاركة السابقة في موهبة:</strong> {viewingStudentModal.mawhiba || 'غير محدد'}</p>
                                </div>
                                <button onClick={() => setViewingStudentModal(null)} className="w-full bg-blue-600 text-white py-2 rounded font-bold text-sm">إغلاق</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function AdminSupportChatsManager({ students }) {
            const [selectedStudent, setSelectedStudent] = useState(null);
            const [messages, setMessages] = useState([]);
            const [replyText, setReplyText] = useState("");
            const studentList = students.filter(s => s.role === 'student');

            useEffect(() => {
                if (!selectedStudent) return;
                const q = query(collection(window.db, "users", selectedStudent.id, "supportChat"), orderBy("createdAt", "asc"));
                const unsub = onSnapshot(q, (snap) => {
                    setMessages(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                });
                return () => unsub();
            }, [selectedStudent]);

            const handleSendReply = async (e) => {
                e.preventDefault();
                if (!replyText.trim() || !selectedStudent) return;
                await addDoc(collection(window.db, "users", selectedStudent.id, "supportChat"), {
                    sender: "admin",
                    text: replyText,
                    createdAt: new Date().toISOString()
                });
                setReplyText("");
            };

            return (
                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 bg-white p-6 rounded-lg shadow min-h-[500px]">
                    <div className="lg:col-span-1 border-l pl-4 space-y-2">
                        <h3 className="font-bold text-lg mb-3">اختر طالباً للمراسلة</h3>
                        {studentList.map(st => (
                            <button key={st.id} onClick={() => setSelectedStudent(st)} className={`w-full text-right p-3 rounded font-bold text-sm ${selectedStudent?.id === st.id ? 'bg-blue-600 text-white' : 'bg-slate-100 text-gray-700'}`}>
                                {st.fullName || st.username}
                            </button>
                        ))}
                    </div>
                    <div className="lg:col-span-2 flex flex-col justify-between">
                        {selectedStudent ? (
                            <>
                                <div className="border-b pb-2 mb-4"><h3 className="font-bold text-blue-900">محادثة مع: {selectedStudent.fullName}</h3></div>

                    if (docSnap.exists()) setProfile(docSnap.data());
                };
                fetchProfile();

                const q = query(collection(window.db, "courses"), orderBy("createdAt", "desc"));
                const unsubscribe = onSnapshot(q, (snapshot) => {
                    setCourses(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });

                const qPromos = query(collection(window.db, "promos"), orderBy("createdAt", "desc"));
                const unsubPromos = onSnapshot(qPromos, (snapshot) => {
                    setPromos(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });

                const unsubEnrolled = onSnapshot(collection(window.db, "users", user.uid, "enrolledCourses"), (snap) => {
                    setEnrolledCourseIds(snap.docs.map(d => d.id));
                });

                        const data = d.data();
                        if (data.studentId === user.uid) {
                            reqMap[data.courseId] = data.status;
                        }
                    });
                    setMyRequests(reqMap);
                });

                return () => {
                    unsubscribe();
                    unsubPromos();
                    unsubEnrolled();
                    unsubReqs();

                            <button onClick={() => { setActiveTab("myCourses"); setSelectedCourse(null); }} className={`px-4 py-2 rounded font-bold text-sm ${activeTab === 'myCourses' && !selectedCourse ? 'bg-blue-600 text-white' : 'bg-gray-200'}`}>دوراتي ({enrolledCoursesList.length})</button>
                            <button onClick={() => { setActiveTab("profile"); setSelectedCourse(null); }} className={`px-4 py-2 rounded font-bold text-sm ${activeTab === 'profile' ? 'bg-blue-600 text-white' : 'bg-gray-200'}`}>ملف الطالب 👤</button>
                            <button onClick={() => signOut(window.auth)} className="bg-red-50 text-red-600 px-3 py-2 rounded font-bold text-sm">خروج</button>
                        </div>
                    </div>

                    {selectedCourse ? (
                        <StudentCourseView course={selectedCourse} user={user} profile={profile} onBack={() => setSelectedCourse(null)} />

                        <>
                            {activeTab === "explore" && (
                                <div className="space-y-8">
                                    {promos.length > 0 && (
                                        <div className="bg-gradient-to-r from-blue-900 to-teal-800 p-6 rounded-2xl shadow-xl text-white">
                                            <h2 className="text-xl font-bold mb-4">🌟 عروض وإعلانات منصة إبداع</h2>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                                {promos.map(p => (
                                                    <div key={p.id} className="bg-white/10 p-4 rounded-xl backdrop-blur border border-white/20">
                                                        <h3 className="font-bold text-lg mb-2">{p.title}</h3>

                                                            <img src={p.url} alt={p.title} className="w-full h-48 object-cover rounded-lg shadow" />

                                                                <iframe src={p.url} className="w-full h-full" allowFullScreen></iframe>
                                                            </div>
                                                        )}
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    <div>
                                        <h2 className="text-xl font-bold text-blue-900 mb-4">جميع الدورات المتاحة</h2>
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                            {courses.map(course => {
                                                const isEnrolled = enrolledCourseIds.includes(course.id);
                                                const reqStatus = myRequests[course.id];
                                                return (
                                                    <div key={course.id} className="bg-white rounded-lg shadow overflow-hidden flex flex-col border-t-4 border-blue-500">

                            {activeTab === "myCourses" && (

                                            {course.imageUrl && <img src={course.imageUrl} className="w-full h-40 object-cover" />}
                                            <div className="p-4 flex flex-col flex-1">
                                                <h3 className="font-bold text-lg text-blue-900 mb-2">{course.title}</h3>
                                                <p className="text-gray-500 text-sm mb-4 flex-1">{course.desc}</p>
                                                <button onClick={() => setSelectedCourse(course)} className="w-full bg-blue-600 text-white py-2 rounded font-bold text-sm">مشاهدة الحلقات 📺</button>
                                            </div>

                                </div>
                            )}

                            {activeTab === "profile" && <StudentProfileView user={user} profile={profile} onUpdate={(newProf) => setProfile(newProf)} />}
                        </>
                    )}

                    <div className="fixed bottom-4 left-4 z-50">
                        {showSupportChat ? (
                            <div className="bg-white rounded-lg shadow-2xl border w-80 flex flex-col h-96">
                                <div className="bg-blue-600 text-white p-3 rounded-t-lg flex justify-between items-center">

                        )}

        function StudentCloudChat({ user }) {
            const [messages, setMessages] = useState([]);
            const [text, setText] = useState("");

            useEffect(() => {
                const q = query(collection(window.db, "users", user.uid, "supportChat"), orderBy("createdAt", "asc"));
                const unsub = onSnapshot(q, (snap) => {
                    setMessages(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                });
                return () => unsub();
            }, [user.uid]);

            const handleSend = async (e) => {
                e.preventDefault();
                if (!text.trim()) return;
                await addDoc(collection(window.db, "users", user.uid, "supportChat"), {
                    sender: "student",
                    text: text,
                    createdAt: new Date().toISOString()
                });
                setText("");
            };

            return (
                <div className="flex flex-col flex-1 p-3 overflow-hidden">
                    <div className="flex-1 overflow-y-auto space-y-2 mb-2 p-1 text-xs">
                        {messages.length === 0 && <p className="text-gray-400 text-center mt-10">أهلاً بك! اكتب استفسارك للإدارة وسنرد عليك هنا.</p>}
                        {messages.map(m => (
                            <div key={m.id} className={`p-2 rounded max-w-[85%] ${m.sender === 'student' ? 'bg-blue-600 text-white mr-auto' : 'bg-slate-200 text-gray-800 ml-auto'}`}>
                                <span className="block font-bold text-[9px] opacity-75 mb-0.5">{m.sender === 'student' ? 'أنت' : 'الإدارة 👑'}</span>
                                {m.text}
                            </div>
                        ))}
                    </div>
                    <form onSubmit={handleSend} className="flex gap-1 border-t pt-2">
                        <input type="text" value={text} onChange={e => setText(e.target.value)} placeholder="اكتب رسالتك..." className="flex-1 px-2 py-1 border rounded text-xs outline-none" />
                        <button type="submit" className="bg-blue-600 text-white px-3 py-1 rounded text-xs font-bold">إرسال</button>
                    </form>
                </div>
            );
        }

                    </form>

            const [comments, setComments] = useState([]);
            const [newComment, setNewComment] = useState("");

            useEffect(() => {
                const q = query(collection(window.db, "courses", course.id, "lectures"), orderBy("createdAt", "asc"));
                const unsub = onSnapshot(q, (snap) => {
                    const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    setLectures(list);
                    if (list.length > 0 && !activeLecture) setActiveLecture(list[0]);
                });
                return () => unsub();
            }, [course.id]);

                if (!activeLecture) return;
                const qComm = query(collection(window.db, "courses", course.id, "lectures", activeLecture.id, "comments"), orderBy("createdAt", "asc"));
                const unsubComm = onSnapshot(qComm, (snap) => {
                    setComments(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                });
                return () => unsubComm();
            }, [course.id, activeLecture]);

            const handleAddComment = async (e) => {
                e.preventDefault();
                if (!newComment.trim()) return;
                await addDoc(collection(window.db, "courses", course.id, "lectures", activeLecture.id, "comments"), {
                    userId: user.uid,
                    userName: profile?.fullName || user.email.split('@')[0],

                                        {idx + 1}. {lec.title}

                                    )}

                                    <div className="border-t pt-4 mt-6">
                                        <h4 className="font-bold mb-3">التعليقات التفاعلية 💬</h4>
                                        <div className="space-y-3 mb-4 max-h-60 overflow-y-auto">
                                            {comments.map(c => (
                                                <div key={c.id} className={`p-3 rounded text-sm ${c.isAdminReply ? 'bg-blue-50 border-r-4 border-blue-600 mr-6' : 'bg-gray-100'}`}>
                                                    <span className="font-bold block text-xs text-blue-800 mb-1">{c.userName} {c.isAdminReply && '(الإدارة 👑)'}</span>
                                                    {c.text}
                                                </div>
                                            ))}
                                        </div>
                                        <form onSubmit={handleAddComment} className="flex gap-2">
                                            <input type="text" value={newComment} onChange={e => setNewComment(e.target.value)} placeholder="اكتب تعليقك..." className="flex-1 px-3 py-2 border rounded outline-none text-sm" />
                                            <button type="submit" className="bg-blue-600 text-white px-4 py-2 rounded font-bold text-sm">إرسال</button>
                                        </form>
                                    </div>
                                </>
                            ) : (
                                <p className="text-gray-400 text-center py-20">اختر حلقة لبدء المشاهدة</p>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
