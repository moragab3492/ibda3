<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة إبداع التعليمية</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, setDoc, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDwSZe5sUglFRmXKbGLqtS6_5qO1r5wf9o",
            authDomain: "ibda3-91fde.firebaseapp.com",
            projectId: "ibda3-91fde",
            storageBucket: "ibda3-91fde.firebasestorage.app",
            messagingSenderId: "203097189746",
            appId: "1:203097189746:web:af3a59c8eee851663881eb"
        };

        const app = initializeApp(firebaseConfig);
        window.auth = getAuth(app);
        window.db = getFirestore(app);
        window.firebaseAPI = {
            onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut,
            collection, addDoc, doc, setDoc, getDoc, deleteDoc, onSnapshot, query, orderBy
        };
    </script>
</head>
<body class="bg-slate-50 font-sans text-gray-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { 
            onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut,
            doc, setDoc, getDoc, collection, addDoc, deleteDoc, onSnapshot, query, orderBy 
        } = window.firebaseAPI;

        function App() {
            const [user, setUser] = useState(null);
            const [role, setRole] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const unsubscribe = onAuthStateChanged(window.auth, async (currentUser) => {
                    setUser(currentUser);
                    if (currentUser) {
                        try {
                            const userDoc = await getDoc(doc(window.db, "users", currentUser.uid));
                            if (userDoc.exists()) {
                                setRole(userDoc.data().role);
                            } else {
                                setRole("student");
                            }
                        } catch (error) {
                            console.error("Error fetching role:", error);
                            setRole("student");
                        }
                    } else {
                        setRole(null);
                    }
                    setLoading(false);
                });
                return () => unsubscribe();
            }, []);

            if (loading) return <div className="flex items-center justify-center min-h-screen text-blue-600 font-bold text-xl">جاري تحميل منصة إبداع...</div>;

            if (!user) return <Login />;
            if (role === "super_admin" || role === "admin") return <AdminDashboard user={user} role={role} />;
            return <StudentDashboard user={user} />;
        }

        // --- واجهة تسجيل الدخول ---
        function Login() {
            const [username, setUsername] = useState("");
            const [password, setPassword] = useState("");
            const [error, setError] = useState("");
            const [loading, setLoading] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError(""); setLoading(true);
                const email = username.trim().toLowerCase() + "@ebdaa.com";

                try {
                    await signInWithEmailAndPassword(window.auth, email, password);
                } catch (err) {
                    setError("بيانات الدخول غير صحيحة. يرجى مراجعة الإدارة.");
                }
                setLoading(false);
            };

            return (
                <div className="flex items-center justify-center min-h-screen p-4 bg-slate-100">
                    <div className="bg-white p-8 rounded-xl shadow-lg w-full max-w-sm border-t-4 border-blue-600">
                        <div className="text-center mb-6">
                            <h2 className="text-3xl font-bold text-blue-800 mb-2">منصة إبداع 💡</h2>
                            <h3 className="text-gray-500 text-sm">مرحباً بك في بوابتك للتعلم</h3>
                        </div>
                        {error && <p className="text-red-500 text-sm mb-4 text-center font-bold bg-red-50 p-2 rounded">{error}</p>}
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-gray-700 text-sm font-bold mb-1">اسم المستخدم</label>
                                <input type="text" required value={username} onChange={(e) => setUsername(e.target.value)} className="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="مثال: ragab" />
                            </div>
                            <div>
                                <label className="block text-gray-700 text-sm font-bold mb-1">كلمة المرور</label>
                                <input type="password" required value={password} onChange={(e) => setPassword(e.target.value)} className="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="******" />
                            </div>
                            <button type="submit" disabled={loading} className="w-full bg-blue-600 text-white py-2 rounded-lg font-bold hover:bg-blue-700 transition">
                                {loading ? "جاري الدخول..." : "تسجيل الدخول"}
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        // --- لوحة الإدارة ---
        function AdminDashboard({ user, role }) {
            const [courses, setCourses] = useState([]);
            // حالات نموذج إضافة الدورة
            const [title, setTitle] = useState("");
            const [duration, setDuration] = useState("");
            const [targetAudience, setTargetAudience] = useState("");
            const [instructor, setInstructor] = useState("");
            const [desc, setDesc] = useState("");
            const [imageUrl, setImageUrl] = useState("");

            useEffect(() => {
                const q = query(collection(window.db, "courses"), orderBy("createdAt", "desc"));
                const unsubscribe = onSnapshot(q, (snapshot) => {
                    setCourses(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });
                return () => unsubscribe();
            }, []);

            const handleAddCourse = async (e) => {
                e.preventDefault();
                await addDoc(collection(window.db, "courses"), {
                    title, duration, targetAudience, instructor, desc, imageUrl,
                    createdAt: new Date().toISOString()
                });
                // تفريغ الحقول بعد الإضافة
                setTitle(""); setDuration(""); setTargetAudience(""); setInstructor(""); setDesc(""); setImageUrl("");
            };

            const handleDeleteCourse = async (id) => {
                if (confirm("هل أنت متأكد من حذف هذه الدورة؟")) {
                    await deleteDoc(doc(window.db, "courses", id));
                }
            };

            return (
                <div className="p-4 md:p-8 max-w-7xl mx-auto">
                    <div className="flex flex-col sm:flex-row justify-between items-center border-b pb-4 mb-6 gap-4">
                        <div>
                            <h1 className="text-2xl font-bold text-blue-800">لوحة الإدارة ⚙️</h1>
                            <p className="text-sm text-gray-500 mt-1">مرحباً بك، الصلاحية: {role === 'super_admin' ? 'مدير عام 👑' : 'مشرف 🛡️'}</p>
                        </div>
                        <button onClick={() => signOut(window.auth)} className="bg-red-50 text-red-600 px-4 py-2 rounded-lg font-bold hover:bg-red-100">تسجيل الخروج</button>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        {/* نموذج إضافة دورة */}
                        <div className="lg:col-span-1">
                            <div className="bg-white p-6 rounded-lg shadow border-t-4 border-blue-600">
                                <h2 className="text-lg font-bold mb-4">إضافة دورة جديدة</h2>
                                <form onSubmit={handleAddCourse} className="space-y-3">
                                    <input type="text" placeholder="اسم الدورة *" required value={title} onChange={e => setTitle(e.target.value)} className="w-full px-3 py-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none" />
                                    <input type="text" placeholder="المدرب *" required value={instructor} onChange={e => setInstructor(e.target.value)} className="w-full px-3 py-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none" />
                                    <input type="text" placeholder="مدة الدورة (مثال: 4 أسابيع) *" required value={duration} onChange={e => setDuration(e.target.value)} className="w-full px-3 py-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none" />
                                    <input type="text" placeholder="الفئة المستهدفة *" required value={targetAudience} onChange={e => setTargetAudience(e.target.value)} className="w-full px-3 py-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none" />
                                    <textarea placeholder="وصف الدورة (اختياري)" value={desc} onChange={e => setDesc(e.target.value)} className="w-full px-3 py-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none h-20"></textarea>
                                    <input type="url" placeholder="رابط صورة الغلاف (اختياري)" value={imageUrl} onChange={e => setImageUrl(e.target.value)} className="w-full px-3 py-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none text-left" dir="ltr" />
                                    <button type="submit" className="w-full bg-blue-600 text-white py-2 rounded font-bold hover:bg-blue-700">نشر الدورة</button>
                                </form>
                            </div>
                        </div>

                        {/* قائمة الدورات للإدارة */}
                        <div className="lg:col-span-2">
                            <h2 className="text-xl font-bold mb-4">الدورات الحالية ({courses.length})</h2>
                            <div className="space-y-4">
                                {courses.length === 0 && <p className="text-gray-500">لا توجد دورات مضافة بعد.</p>}
                                {courses.map(course => (
                                    <div key={course.id} className="bg-white p-4 rounded-lg shadow flex flex-col sm:flex-row gap-4 border-r-4 border-blue-500">
                                        {course.imageUrl && <img src={course.imageUrl} alt={course.title} className="w-full sm:w-32 h-24 object-cover rounded" />}
                                        <div className="flex-1">
                                            <div className="flex justify-between">
                                                <h3 className="font-bold text-lg text-blue-900">{course.title}</h3>
                                                <button onClick={() => handleDeleteCourse(course.id)} className="text-red-500 hover:text-red-700 font-bold text-xl">×</button>
                                            </div>
                                            <p className="text-sm text-gray-600 mb-2">{course.desc}</p>
                                            <div className="flex flex-wrap gap-2 text-xs font-bold">
                                                <span className="bg-blue-50 text-blue-700 px-2 py-1 rounded">👨‍🏫 المدرب: {course.instructor}</span>
                                                <span className="bg-green-50 text-green-700 px-2 py-1 rounded">⏱️ المدة: {course.duration}</span>
                                                <span className="bg-purple-50 text-purple-700 px-2 py-1 rounded">🎯 الفئة: {course.targetAudience}</span>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // --- لوحة الطالب (منطقة الاستكشاف) ---
        function StudentDashboard({ user }) {
            const [courses, setCourses] = useState([]);

            useEffect(() => {
                const q = query(collection(window.db, "courses"), orderBy("createdAt", "desc"));
                const unsubscribe = onSnapshot(q, (snapshot) => {
                    setCourses(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });
                return () => unsubscribe();
            }, []);

            return (
                <div className="p-4 md:p-8 max-w-7xl mx-auto">
                    <div className="flex justify-between items-center border-b pb-4 mb-8">
                        <h1 className="text-2xl font-bold text-blue-800">إبداع 💡 | استكشاف الدورات</h1>
                        <button onClick={() => signOut(window.auth)} className="bg-red-50 text-red-600 px-4 py-2 rounded-lg font-bold hover:bg-red-100">خروج</button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {courses.length === 0 && <p className="text-gray-500 col-span-full text-center">لا توجد دورات متاحة حالياً، يرجى العودة لاحقاً.</p>}
                        {courses.map(course => (
                            <div key={course.id} className="bg-white rounded-lg shadow-md overflow-hidden hover:shadow-lg transition flex flex-col h-full border-t-4 border-blue-500">
                                {course.imageUrl ? (
                                    <img src={course.imageUrl} alt={course.title} className="w-full h-48 object-cover" />
                                ) : (
                                    <div className="w-full h-48 bg-slate-200 flex items-center justify-center text-slate-400">لا توجد صورة</div>
                                )}
                                <div className="p-5 flex flex-col flex-1">
                                    <h3 className="font-bold text-xl text-blue-900 mb-2">{course.title}</h3>
                                    <p className="text-gray-600 text-sm mb-4 flex-1">{course.desc || 'لا يوجد وصف متاح.'}</p>
                                    
                                    <div className="space-y-2 text-sm border-t pt-4 mt-auto">
                                        <p><span className="text-gray-500">👨‍🏫 المدرب:</span> <span className="font-bold">{course.instructor}</span></p>
                                        <p><span className="text-gray-500">⏱️ المدة:</span> <span className="font-bold">{course.duration}</span></p>
                                        <p><span className="text-gray-500">🎯 الفئة:</span> <span className="font-bold">{course.targetAudience}</span></p>
                                    </div>
                                    
                                    <button className="mt-4 w-full bg-slate-100 text-blue-700 py-2 rounded font-bold hover:bg-slate-200 transition">
                                        التسجيل بالدورة (مغلق حالياً)
                                    </button>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
